<!doctype html>
<meta charset="utf-8">
<title>Theme Tab Filter</title>
<style>
  :root { color-scheme: light dark;
    --bg: #fff; --fg: #1d1d1f; --muted: #6b6b70; --line: #e3e3e6; --card: #f5f5f7;
    --accent: #2563eb; --accent-fg: #fff; --danger: #c62828; --warn: #8a5a00; --chip: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1f22; --fg: #ececef; --muted: #9a9aa2; --line: #34343a; --card: #2a2a2f;
      --accent: #6b9bff; --accent-fg: #0d1a33; --danger: #ff6b6b; --warn: #f0b54a; --chip: #2a3350;
    }
  }
  * { box-sizing: border-box; }
  body > * { flex: none; }
  html, body { overflow: hidden; }
  body { width: 380px; max-height: 600px; display: flex; flex-direction: column; margin: 0; padding: 14px; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  h1 { font-size: 15px; margin: 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: none; color: var(--muted); padding: 4px 10px; }
  .seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-fg); }

  textarea { width: 100%; resize: vertical; max-height: 120px; flex: none; font: inherit; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--card); color: var(--fg); }
  .chips { display: flex; gap: 6px; margin-top: 6px; overflow-x: auto; scrollbar-width: none; }
  .chips:empty { display: none; }
  .chips button { flex: none; border: 0; background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px;
    max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0 8px; }
  .actions button { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 9px 4px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  .actions button:hover { border-color: var(--accent); }
  .actions b { font-size: 13px; }
  .actions small { font-size: 11px; color: var(--muted); }
  .actions .danger:hover { border-color: var(--danger); }
  .actions .armed, .actions .armed:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
  .actions .armed small { color: #fff; }

  .strict { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .strict input { flex: 1; accent-color: var(--accent); }
  .strict output { width: 32px; text-align: right; }

  #status { margin: 6px 0; font-size: 12px; color: var(--muted); }
  #status:empty { display: none; }
  #status.error { color: var(--danger); }
  #status.warn { color: var(--warn); }

  #list { flex: 1 1 auto; min-height: 0; overflow-y: auto; border-top: 1px solid var(--line); }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 10px 0 4px; }
  .tab { display: flex; align-items: center; gap: 8px; padding: 3px 2px; border-radius: 6px; }
  .tab:hover { background: var(--card); }
  .tab input { margin: 0; accent-color: var(--accent); }
  .tab img { width: 16px; height: 16px; flex: none; }
  .title { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title:hover { text-decoration: underline; }
  .badge { font-size: 10px; padding: 0 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }
  .score { flex: none; width: 44px; font-size: 11px; text-align: right; color: var(--muted); border-radius: 4px; padding: 0 4px;
    background: linear-gradient(to right, color-mix(in srgb, var(--accent) 28%, transparent) calc(var(--p) * 100%), transparent 0); }
  .empty { color: var(--muted); text-align: center; padding: 18px 8px; margin: 0; }

  .toolbar { display: flex; gap: 6px; margin: 10px 0 6px; }
  .toolbar button { flex: 1; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: none; }
  .toolbar button:hover:not(:disabled) { border-color: var(--accent); }
  .toolbar button:disabled { opacity: .4; cursor: default; }

  details { position: relative; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
  .panel { position: absolute; left: 0; right: 0; bottom: 100%; margin-bottom: 6px; padding: 4px 12px 12px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  summary { cursor: pointer; color: var(--muted); }
  details label { display: block; margin: 8px 0 3px; font-weight: 600; }
  details input { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); font: inherit; }
  details p { margin: 4px 0 8px; color: var(--muted); font-size: 12px; }
  details button { padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px; background: none; }

  body.busy .actions button, body.busy .toolbar button { opacity: .5; pointer-events: none; }
</style>

<header>
  <h1>Theme Tab Filter</h1>
  <div class="seg" id="scope" role="group" aria-label="Scope">
    <button data-scope="window">This window</button>
    <button data-scope="all">All windows</button>
  </div>
</header>

<textarea id="topic" rows="1" aria-label="Theme" placeholder="Theme, e.g. building a new server"></textarea>
<div class="chips" id="recent" aria-label="Recent themes"></div>

<div class="actions">
  <button data-action="group" title="Pull matching tabs into one tab group"><b>Group</b><small>matching</small></button>
  <button data-action="window" title="Move matching tabs into a new window"><b>Window</b><small>matching</small></button>
  <button data-action="hide" title="Collapse non-matching tabs into a grey group"><b>Hide</b><small>the rest</small></button>
  <button data-action="close" class="danger" title="Close non-matching tabs (asks first)"><b>Close</b><small>the rest</small></button>
</div>

<div class="strict">
  <label for="threshold">Match strictness</label>
  <input id="threshold" type="range" min="0.05" max="0.95" step="0.05">
  <output id="thresholdOut" for="threshold"></output>
</div>

<div class="toolbar">
  <button id="preview">Preview matches</button>
  <button id="restore">Show hidden tabs</button>
  <button id="undo" hidden>Undo close</button>
</div>

<div id="status" role="status"></div>
<div id="list"></div>


<details id="settings">
  <summary>Settings</summary>
  <div class="panel">
  <label for="key">Jev API key</label>
  <input id="key" type="password" autocomplete="off" placeholder="TypeSafe API key">
  <p>Stored only in this browser. Tab titles and URLs are sent to api.typesafe.ai.</p>
  <button id="clearCache">Clear score cache</button>
  </div>
</details>

<script type="module" src="popup.js"></script>
